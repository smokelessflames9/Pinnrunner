[package]
name = "pinn_achievements"
version = "0.1.0"
description = "PINN Arcade Compressed NFT Achievement Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pinn_achievements"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
mpl-bubblegum = { version = "2.0", features = ["cpi"] }
spl-account-compression = { version = "0.4", features = ["cpi"] }
mpl-token-metadata = { version = "4.0", features = ["cpi"] }
spl-noop = { version = "0.2.0", features = ["no-entrypoint"] }
